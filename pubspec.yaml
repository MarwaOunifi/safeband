name: safeband
description: Application de suivi bracelet Alzheimer SafeBand
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  flutter_dotenv : ^5.1.0

  # Firebase SDK v3 (compatible Dart 3 + Flutter 3.19+)
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_messaging: ^15.1.3
  firebase_database: ^11.1.4

  # Maps (Android/iOS uniquement)
  google_maps_flutter: ^2.9.0
  geolocator: ^13.0.1

  # Notifications
  flutter_local_notifications: ^18.0.1

  # State management
  flutter_riverpod: ^2.5.1

  # Utils
  intl: ^0.19.0
  shared_preferences: ^2.3.2
  permission_handler: ^11.3.1
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/