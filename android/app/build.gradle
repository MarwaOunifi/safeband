plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
    id "dev.flutter.flutter-gradle-plugin"
    id "com.google.gms.google-services"
}

def flutterVersionCodeProperty = project.findProperty('flutter.versionCode')
def flutterVersionNameProperty = project.findProperty('flutter.versionName')
def effectiveFlutterVersionCode = flutterVersionCodeProperty != null ?
        flutterVersionCodeProperty.toString().toInteger() :
        (project.hasProperty('flutterVersionCode') ? flutterVersionCode.toString().toInteger() : 1)
def effectiveFlutterVersionName = flutterVersionNameProperty != null ?
        flutterVersionNameProperty.toString() :
        (project.hasProperty('flutterVersionName') ? flutterVersionName.toString() : '1.0.0')

android {
    namespace "com.safeband.app"
    compileSdk flutter.compileSdkVersion
    ndkVersion flutter.ndkVersion

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        applicationId "com.safeband.app"
        minSdkVersion flutter.minSdkVersion
        targetSdkVersion flutter.targetSdkVersion
        versionCode effectiveFlutterVersionCode
        versionName effectiveFlutterVersionName
        multiDexEnabled true
    }

    buildTypes {
        release {
            signingConfig signingConfigs.debug
            minifyEnabled false
            shrinkResources false
        }
        debug {
            minifyEnabled false
            shrinkResources false
        }
    }
}

flutter {
    source '../..'
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.4'
    implementation platform('com.google.firebase:firebase-bom:33.5.1')
    implementation 'com.google.firebase:firebase-analytics-ktx'
    implementation 'com.google.firebase:firebase-messaging-ktx'
    implementation 'androidx.multidex:multidex:2.0.1'
}
